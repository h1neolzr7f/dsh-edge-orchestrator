name: Go Phase 0-1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: '**/go.sum'
      - run: bash scripts/check.sh
      - run: go test -race ./tests ./apps/coordinator ./apps/edge-agent ./packages/edge-link
      - if: runner.os == 'Linux'
        run: bash scripts/build.sh
