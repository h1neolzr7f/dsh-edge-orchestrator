name: Fleet V1 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/check.sh
      - run: go test -race ./tests ./apps/coordinator ./apps/edge-agent ./packages/edge-link
      - if: runner.os == 'Linux'
        run: bash scripts/build.sh
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: '**/go.sum'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: bash scripts/check-ui.sh
        env:
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
